<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{layout::link-css}"></th:block>
    <th:block th:replace="~{layout::custom-css}"></th:block>
    <title th:text="${book.title} + ' - BookStore'">Book Details - BookStore</title>
</head>

<body>
    <th:block th:replace="~{layout::header}"></th:block>

    <div class="container mt-4">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/" class="text-decoration-none">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/books}" class="text-decoration-none">Books</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${book.title}">Book Title</li>
            </ol>
        </nav>

        <div class="book-detail-container">
            <div class="book-detail-grid">
                <!-- Book Image -->
                <div class="text-center">
                    <img th:if="${book.image}" th:src="@{'/books/images/' + ${book.image}}" th:alt="${book.title}"
                        class="book-detail-image">
                    <div th:unless="${book.image}" class="book-image">
                        <i class="fas fa-book fa-8x"></i>
                        <p class="mt-3 text-muted">No image available</p>
                    </div>
                </div>

                <!-- Book Information -->
                <div class="book-detail-info">
                    <h1 th:text="${book.title}">Book Title</h1>

                    <p class="book-detail-author">
                        <i class="fas fa-user-edit me-2"></i>
                        by <span th:text="${book.author}">Author Name</span>
                    </p>

                    <div class="book-category mb-3">
                        <i class="fas fa-tag me-1"></i>
                        <span th:text="${book.category != null ? book.category.name : 'No Category'}">Category</span>
                    </div>

                    <div class="book-detail-price">
                        <i class="fas fa-dollar-sign me-1"></i>$<span
                            th:text="${#numbers.formatDecimal(book.price, 0, 2)}">0.00</span>
                    </div>

                    <div class="book-detail-description" th:if="${book.description}">
                        <h3><i class="fas fa-info-circle me-2"></i>Description</h3>
                        <p th:text="${book.description}">Book description goes here...</p>
                    </div>

                    <!-- Action Buttons -->
                    <div class="mt-4">
                        <form th:action="@{/books/add-to-cart}" method="post" class="d-inline me-3">
                            <input type="hidden" name="id" th:value="${book.id}">
                            <input type="hidden" name="name" th:value="${book.title}">
                            <input type="hidden" name="price" th:value="${book.price}">

                            <div class="input-group mb-3" style="width: 200px;">
                                <span class="input-group-text">Quantity</span>
                                <input type="number" name="quantity" class="form-control" value="1" min="1" max="99">
                            </div>

                            <button type="submit" class="btn btn-success-modern btn-lg">
                                <i class="fas fa-shopping-cart me-2"></i>Add to Cart
                            </button>
                        </form>

                        <!-- Admin Actions -->
                        <div class="mt-3" sec:authorize="hasRole('ADMIN')">
                            <a class="btn btn-primary-modern me-2" th:href="@{'/books/edit/' + ${book.id}}">
                                <i class="fas fa-edit me-2"></i>Edit
                            </a>
                            <a class="btn btn-danger-modern" th:href="@{'/books/delete/' + ${book.id}}"
                                onclick="return confirm('Are you sure you want to delete this book?')">
                                <i class="fas fa-trash me-2"></i>Delete
                            </a>
                        </div>
                    </div>

                    <!-- Back to List -->
                    <div class="mt-4 pt-3 border-top">
                        <a th:href="@{/books}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-2"></i>Back to Books
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Related Books Section -->
        <div class="mt-5">
            <h3 class="mb-4">
                <i class="fas fa-books me-2"></i>More Books in
                <span th:text="${book.category.name}">Category</span>
            </h3>
            <div class="alert-modern" style="background: #e3f2fd; color: #0d47a1; border-left-color: #2196f3;">
                <i class="fas fa-info-circle me-2"></i>
                Related books feature will be implemented in future updates.
            </div>
        </div>
    </div>

    <th:block th:replace="~{layout::footer}"></th:block>
</body>

</html>
