<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookStore - Your Digital Library</title>
  <link th:fragment="link-css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <!-- Bootstrap CDN as fallback -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-9ndCyUa6J2ccvx3kKuCqab6k6d6EmYXJrqZ5/oV8jNzT7nKjUKTJ/MWOV0V8Mq6h" crossorigin="anonymous">
  <link th:fragment="custom-css" rel="stylesheet" th:href="@{/css/style.css}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">
  <header th:fragment="header">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="/">
          <i class="fas fa-book-open me-2"></i>BookStore
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="/">
                <i class="fas fa-home me-1"></i>Home
              </a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_USER')">
              <a class="nav-link" href="/books">
                <i class="fas fa-books me-1"></i>Books
              </a>
            </li>
            <li class="nav-item dropdown" sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_USER')">
              <a class="nav-link dropdown-toggle" href="#" id="categoryDropdown" role="button" data-bs-toggle="dropdown"
                aria-expanded="false">
                <i class="fas fa-tags me-1"></i>Categories
              </a>
              <ul class="dropdown-menu" aria-labelledby="categoryDropdown">
                <li><a class="dropdown-item" href="/books"><i class="fas fa-th-large me-1"></i>All Books</a></li>
                <li>
                  <hr class="dropdown-divider">
                </li>
                <li th:each="cat : ${navCategories}">
                  <a class="dropdown-item" th:href="@{/books(category=${cat.id})}" th:text="${cat.name}">Category</a>
                </li>
              </ul>
            </li>
            <li class="nav-item dropdown" sec:authorize="hasAuthority('ROLE_ADMIN')">
              <a class="nav-link dropdown-toggle" href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown"
                aria-expanded="false">
                <i class="fas fa-cog me-1"></i>Admin
              </a>
              <ul class="dropdown-menu" aria-labelledby="adminDropdown">
                <li><a class="dropdown-item" href="/admin"><i class="fas fa-tachometer-alt me-1"></i>Dashboard</a></li>
                <li><a class="dropdown-item" href="/admin/books"><i class="fas fa-book me-1"></i>Manage Books</a></li>
                <li><a class="dropdown-item" href="/admin/categories"><i class="fas fa-tags me-1"></i>Manage
                    Categories</a></li>
                <li>
                  <hr class="dropdown-divider">
                </li>
                <li><a class="dropdown-item" href="/admin/books/export"><i class="fas fa-file-excel me-1"></i>Export
                    Excel</a></li>
              </ul>
            </li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item" sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_USER')">
              <a class="nav-link position-relative" href="/cart">
                <i class="fas fa-shopping-cart me-1"></i>Cart
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                  <span id="cart-count">0</span>
                </span>
              </a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
              <div class="dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown"
                  aria-expanded="false">
                  <i class="fas fa-user me-1"></i><span sec:authentication="name"></span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                  <li><a class="dropdown-item" href="/profile"><i class="fas fa-user-edit me-1"></i>Profile</a></li>
                  <li><a class="dropdown-item" href="/orders"><i class="fas fa-history me-1"></i>Order History</a></li>
                  <li>
                    <hr class="dropdown-divider">
                  </li>
                  <li>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                      <button class="dropdown-item text-danger" type="submit">
                        <i class="fas fa-sign-out-alt me-1"></i>Logout
                      </button>
                    </form>
                  </li>
                </ul>
              </div>
            </li>
            <!-- Backup logout button if dropdown doesn't work -->
            <li class="nav-item" sec:authorize="isAuthenticated()">
              <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-danger btn-sm ms-2" type="submit" title="Logout">
                  <i class="fas fa-sign-out-alt"></i>
                </button>
              </form>
            </li>
            <li class="nav-item" sec:authorize="!isAuthenticated()">
              <a class="btn btn-outline-light ms-2" href="/login">
                <i class="fas fa-sign-in-alt me-1"></i>Login
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-grow-1">
    <div th:fragment="content"></div>
  </main>

  <footer th:fragment="footer" class="footer">
    <div class="container">
      <div class="row">
        <div class="col-md-6">
          <p>&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> BookStore. All rights reserved.</p>
        </div>
        <div class="col-md-6 text-end">
          <p>Powered by <a href="https://www.hutech.edu.vn/" target="_blank">HUTECH Education</a></p>
        </div>
      </div>
    </div>
    <script th:src="@{/js/jquery-3.7.0.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <!-- Bootstrap CDN as fallback -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
      crossorigin="anonymous"></script>
    <script>
      // Update cart count dynamically
      function updateCartCount() {
        // This would typically be updated via AJAX
        // For now, we'll use a placeholder
      }

      // Initialize Bootstrap dropdowns
      document.addEventListener('DOMContentLoaded', function () {
        // Ensure dropdowns work properly
        var dropdownElementList = [].slice.call(document.querySelectorAll('.dropdown-toggle'));
        var dropdownList = dropdownElementList.map(function (dropdownToggleEl) {
          return new bootstrap.Dropdown(dropdownToggleEl);
        });
      });
    </script>
  </footer>
</body>

</html>
